[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoribo-training"
version = "0.1.0"
description = "EvoRibo RESM/BPP-conditioned coevolution training source release"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["EvoRibo"]
py-modules = ["inverse_coevo_sampler"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
